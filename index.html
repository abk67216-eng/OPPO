<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPPO & 一加 产品实时报价</title>
    <style>
        :root {
            --bg-color: #f2f4f7;
            --card-bg: #ffffff;
            --primary: #0066cc;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --price-w: #d9363e;
            --price-r: #0066cc;
            --border: #e5e5ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }
        
        #auth-screen {
            max-width: 380px; margin: 60px auto 0; background: var(--card-bg);
            padding: 30px 20px; border-radius: 20px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        #auth-screen h2 { font-size: 20px; margin-bottom: 8px; }
        #auth-screen p { color: var(--text-sub); font-size: 14px; margin-bottom: 20px; }
        .pwd-input {
            width: 100%; padding: 12px; font-size: 18px; text-align: center;
            border: 1px solid var(--border); border-radius: 10px; outline: none;
            margin-bottom: 14px; background: #f9f9fb;
        }
        .pwd-btn {
            width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
            background: var(--primary); color: #fff; border: none; border-radius: 10px; cursor: pointer;
        }
        .error-msg { color: var(--price-w); font-size: 13px; margin-top: 10px; display: none; }

        #main-screen { display: none; max-width: 680px; margin: 0 auto; }
        
        .banner-container {
            width: 100%; height: 160px; position: relative;
            background: #1a1a1a; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .banner-title { color: #fff; font-size: 22px; font-weight: bold; }

        .content-body { padding: 16px; }

        .search-box {
            width: 100%; padding: 12px 16px; font-size: 15px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card-bg); outline: none; margin-bottom: 16px;
        }

        .model-card {
            background: var(--card-bg); border-radius: 14px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .model-header {
            font-size: 17px; font-weight: 700; color: var(--text-main);
            padding-bottom: 8px; border-bottom: 2px solid var(--primary); margin-bottom: 10px;
        }
        .config-list { list-style: none; }
        .config-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px dashed var(--border);
        }
