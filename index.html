<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPPO & 一加 产品实时报价</title>
    <style>
        :root {
            --bg-color: #f2f4f7;
            --card-bg: #ffffff;
            --primary: #0066cc;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --price-w: #d9363e; /* 进价 - 红色 */
            --price-r: #0066cc; /* 卖价 - 蓝色 */
            --border: #e5e5ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }
        
        /* 密码登录屏 */
        #auth-screen {
            max-width: 380px; margin: 80px auto 0; background: var(--card-bg);
            padding: 35px 25px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        #auth-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        #auth-screen p { color: var(--text-sub); font-size: 14px; margin-bottom: 24px; }
        .pwd-input {
            width: 100%; padding: 14px; font-size: 18px; text-align: center;
            border: 1px solid var(--border); border-radius: 12px; outline: none;
            margin-bottom: 16px; background: #f9f9fb; letter-spacing: 4px;
        }
        .pwd-btn {
            width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
            background: var(--primary); color: #fff; border: none; border-radius: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .pwd-btn:active { background: #004499; }
        .error-msg { color: var(--price-w); font-size: 13px; margin-top: 12px; display: none; }

        /* 主报价页面 */
        #main-screen { display: none; max-width: 680px; margin: 0 auto; }

        .banner
